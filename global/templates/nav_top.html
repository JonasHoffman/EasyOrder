{% load static %}

<ul class="nav-top">
    {% for item in nav %}
        <li>
            <a href="/estoque/{{ item.url }}" 
               onclick="window.open(this.href, 'novaJanela', 'width=800,height=600'); return false;">
                {{ item.nome }}
            </a>
        </li>
    {% endfor %}
</ul>

<div class="search-wrapper">
    <form action="{% url 'buscas:buscar_sugestoes' %}" method="GET" class="search-form display-flex" id="searchForm">
        <input 
            type="text" 
            name="q" 
            id="searchInput"
            placeholder="Buscar produtos, categorias..." 
            class="form-control search-input"
            autocomplete="off"
        >
        <button type="submit" class="btn-search" aria-label="Buscar">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </button>
    </form>
    <div id="suggestionsBox" class="suggestions-box"></div>
</div>

<script src="{% static 'javascript/buscas.js' %}"></script>
