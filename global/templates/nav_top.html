{% load static %}

{% for item in nav %}

    <li class="nav-topic">

        {% if item.url == "cardapio" %}

            <a href="/cardapio/cardapio_cliente/{{ request.user.perfil.loja.slug }}/">
                {{ item.nome }}
            </a>

        {% else %}

            <a href="/cardapio/{{ item.url }}/">
                {{ item.nome }}
            </a>

        {% endif %}

    </li>

{% endfor %}

<div class="search-wrapper">
    <form action="{% url 'buscas:buscar_sugestoes' %}" method="GET" class="search-form display-flex" id="searchForm">
        <input 
            type="text" 
            name="q" 
            id="searchInput"
            placeholder="Buscar produtos, categorias..." 
            class="form-control search-input"
            autocomplete="off"
        >
        <button type="submit" class="btn-search" aria-label="Buscar" class="background-nocolor">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </button>
    </form>
    <div id="suggestionsBox" class="suggestions-box"></div>
</div>

<div class="dropdown">

    <!-- ========================================================= -->
    <!-- BOTÃO CARRINHO -->
    <!-- ========================================================= -->

    <button
        class="btn btn-link position-relative text-dark p-1"
        type="button"
        id="carrinhoDropdown"
        data-bs-toggle="dropdown"
        aria-expanded="false"
        data-bs-auto-close="outside"
    >

        <i class="bi bi-cart3 fs-4"></i>

        <span
            id="carrinho-badge"
            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
            style="{% if not carrinho|length %}display:none;{% endif %}"
        >
            {{ carrinho|length }}
        </span>

    </button>


    <!-- ========================================================= -->
    <!-- DROPDOWN -->
    <!-- ========================================================= -->

    <div
        class="dropdown-menu dropdown-menu-end p-3 shadow"
        aria-labelledby="carrinhoDropdown"
        data-bs-auto-close="outside"
        style="width: 600px; max-height: 500px; overflow-y: auto;"
    >

        <!-- ===================================================== -->
        <!-- ITENS -->
        <!-- ===================================================== -->

        <div id="carrinho-itens">

            {% include 'templates/carrinho_itens.html' %}

        </div>


        <!-- ===================================================== -->
        <!-- TOTAL -->
        <!-- ===================================================== -->

        <div class="border-top pt-3 mt-3">

            <div class="d-flex justify-content-between align-items-center mb-3">

                <span class="fw-semibold">
                    Total
                </span>

                <strong id="carrinho-total-valor">
                    R$ {{ carrinho.get_total|floatformat:2 }}
                </strong>

            </div>


            <!-- ================================================= -->
            <!-- FINALIZAR -->
            <!-- ================================================= -->

            <a
                href="{% url 'carrinho:carrinho_detalhe' %}"
                class="btn btn-success w-100 btn-carrinho"
            >
                Finalizar pedido
            </a>

        </div>

    </div>

</div>

<script src="{% static 'javascript/buscas.js' %}"></script>
