{% extends "templates/base.html" %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'css/login.css' %}">

<div class="login-page">

    <div class="login-card">

        <div class="login-header">

            <div class="login-logo">
                EASYORDER
            </div>

            <h1>Entrar</h1>

            <p>
                Acesse sua conta para continuar.
            </p>

        </div>


        {% if messages %}

            {% for message in messages %}

                <div class="login-message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        <form method="POST">

            {% csrf_token %}

            <div class="login-field">

                <label for="username">
                    Usuário
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Digite seu usuário"
                    required
                >

            </div>


            <div class="login-field">

                <label for="password">
                    Senha
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Digite sua senha"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                Entrar
            </button>

        </form>

    </div>

</div>

{% endblock %}
