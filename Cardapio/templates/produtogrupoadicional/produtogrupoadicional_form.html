{% extends "templates/base.html" %}


{% block content %}


<div>



    <div class="d-flex justify-content-between align-items-center mb-4">



        <div>


            <h2>


                {% if form.instance.pk %}

                    Editar Grupo de Adicional


                {% else %}

                    Novo Grupo de Adicional


                {% endif %}


            </h2>



        </div>




        <a href="{% url 'produto_grupo_adicional:listar' %}"
           class="btn btn-outline-secondary">


            Voltar


        </a>



    </div>





    <form method="POST">


        {% csrf_token %}



        <div class="card">



            <div class="card-header">


                <h5 class="mb-0">


                    Dados do Vínculo


                </h5>


            </div>





            <div class="card-body">



                <div class="mb-4">


                    <label class="form-label">


                        Produto


                    </label>



                    {{ form.produto }}



                </div>





                <div class="mb-4">


                    <label class="form-label">


                        Grupo de Adicional


                    </label>



                    {{ form.grupo }}



                </div>




            </div>





            <div class="card-footer text-end">



                <a href="{% url 'produto_grupo_adicional:listar' %}"
                   class="btn btn-outline-secondary">


                    Cancelar


                </a>




                <button
                    type="submit"
                    class="btn btn-success">


                    Salvar


                </button>



            </div>



        </div>



    </form>



</div>


{% endblock %}
