{% extends "templates/base.html" %}
{% load static %}

{% block content %}


<div>



    <div class="d-flex justify-content-between align-items-center mb-4">



        <div>


            <h2>


                {% if form.instance.pk %}

                    Editar Grupo de Adicional


                {% else %}

                    Novo Grupo de Adicional


                {% endif %}


            </h2>



        </div>




        <a href="{% url 'produto_grupo_adicional:listar' %}"
           class="btn btn-outline-secondary">


            Voltar


        </a>



    </div>





    <form method="POST">


        {% csrf_token %}



        <div class="card">



            <div class="card-header">


                <h5 class="mb-0">


                    Dados do Vínculo


                </h5>


            </div>





            <div class="card-body">



                <div class="mb-4">

                    <label class="form-label">
                        Produto
                    </label>


                    <div class="row">

                        


                        <div class="col-md-8">

                            {{ form.produto }}

                        </div>
                        <div class="col-md-4">

                            <input
                                type="text"
                                id="buscar-produto"
                                class="form-control"
                                placeholder="Buscar produto..."
                            >

                        </div>

                    </div>

                    

                </div>





                <div class="mb-4">


                    <label class="form-label">


                        Grupo de Adicional


                    </label>



                    {{ form.grupo }}



                </div>




            </div>





            <div class="card-footer text-end">



                <a href="{% url 'produto_grupo_adicional:listar' %}"
                   class="btn btn-outline-secondary btn-cancel btn-padrao">


                    Cancelar


                </a>




                <button
                    type="submit"
                    class="btn btn-success btn-cancel btn-padrao">


                    Salvar


                </button>



            </div>



        </div>



    </form>



</div>

<script src="{% static 'javascript/campodebuscaproduto.js' %}"></script>

{% endblock %}
