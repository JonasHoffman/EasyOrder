{% extends "templates/base.html" %}
{% load static %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header">
            <h4 class="mb-0">
                Organização do Cardápio
            </h4>
            <br>
            <h5 class="mb-0">
                Arraste o item para alterar a ordem
            </h5>
        </div>
        <br>
        

        <div class="card-body">

            <ul
                id="lista-secoes"
                class="list-group"
            >

                {% for secao in secoes %}

                <li
                    class="list-group-item d-flex justify-content-between align-items-center secao-item"
                    data-id="{{ secao.id }}"
                >

                    <div class="d-flex align-items-center gap-3">

                        <span class="drag-handle">
                            ☰
                        </span>


                        <span class="nome-secao">
                            {{ secao.get_tipo_display }}
                        </span>

                    </div>


                    <label class="switch">

                        <input
                            type="checkbox"
                            class="toggle-secao"
                            data-id="{{ secao.id }}"
                            {% if secao.ativo %}
                                checked
                            {% endif %}
                        >

                        <span class="slider">
                            <span class="texto-off">
                                OFF
                            </span>

                            <span class="texto-on">
                                ON
                            </span>
                        </span>

                    </label>


                </li>

                {% endfor %}


            </ul>

        </div>


        <div class="card-footer text-end">

            <button
                id="btnSalvar"
                class="btn btn-success"
            >
                Salvar Alterações
            </button>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

<script src="{% static 'javascript/estruturacardapio.js' %}"></script>

{% endblock %}
