<h2>

</h2>


<div class="row">


{% for produto in secao.dados %}


<div class="col-md-4 mb-3">


<div class="card shadow-sm">


{% if produto.imagem %}

<img
src="{{ produto.imagem.url }}"
class="card-img-top"
>

{% endif %}



<div class="card-body">


<h5>
{{ produto.nome }}
</h5>


<p>
{{ produto.descricao }}
</p>


<strong>
R$ {{ produto.preco }}
</strong>


</div>


</div>


</div>


{% endfor %}


</div>


</div>
