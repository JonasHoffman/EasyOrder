<div class="mb-5">

    <div class="card shadow-sm">

        <div class="card-body">

            {% if secao.imagem %}

                <div class="banner-container">

                    <img
                        src="{{ secao.imagem.url }}"
                        alt="Banner do cardápio"
                        class="banner-imagem"
                    >

                </div>

            {% else %}

                <div class="text-center py-5">

                    <h2>Banner</h2>

                    <p class="text-muted mb-0">
                        Nenhum banner cadastrado.
                    </p>

                </div>

            {% endif %}

        </div>

    </div>

</div>
