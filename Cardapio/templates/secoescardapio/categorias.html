<div class="mb-5">

    <h2 class="mb-3">
        {{ secao.get_tipo_display }}
    </h2>

    <div class="categorias-scroll">

        {% for categoria in secao.dados %}

        <div class="categoria-card">

            <div class="card shadow-sm h-100">

                {% if categoria.imagem %}

                <img
                    src="{{ categoria.imagem.url }}"
                    class="card-img-top"
                    alt="{{ categoria.nome }}"
                >

                {% endif %}

                <div class="card-body">

                    <h5 class="card-title">
                        {{ categoria.nome }}
                    </h5>

                    {% if categoria.descricao %}

                    <p class="card-text">
                        {{ categoria.descricao }}
                    </p>

                    {% endif %}

                </div>

            </div>

        </div>

        {% empty %}

        <p>Nenhuma categoria disponível.</p>

        {% endfor %}

    </div>

</div>
