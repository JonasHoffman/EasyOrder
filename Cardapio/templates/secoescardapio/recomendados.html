<div class="mb-5">

    <h2 class="mb-3">
        {{ secao.get_tipo_display }}
    </h2>

    <div class="categorias-scroll">

        {% for produto in secao.dados %}

        <div class="recomendado-card">

            <div class="card shadow-sm h-100">

                {% if produto.imagem %}

                <img
                    src="{{ produto.imagem.url }}"
                    class="card-img-top"
                    alt="{{ produto.nome }}"
                >

                {% endif %}

                <div class="card-body">

                    <h5 class="card-title">
                        {{ produto.nome }}
                    </h5>

                    {% if produto.descricao %}

                    <p class="card-text">
                        {{ produto.descricao }}
                    </p>

                    {% endif %}

                    <strong class="d-block mt-2">
                        R$ {{ produto.preco }}
                    </strong>

                </div>

            </div>

        </div>

        {% empty %}

        <p>Nenhum produto recomendado disponível.</p>

        {% endfor %}

    </div>

</div>
